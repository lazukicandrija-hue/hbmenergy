<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&amp;display=swap');
      .bhm { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 155px; fill: #1b3b5a; }
      .energy { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 50px; fill: #1b3b5a; letter-spacing: 34px; }
    </style>
  </defs>
  
  <rect width="1000" height="400" fill="#ffffff" />

  <!-- Icon Group -->
  <g transform="translate(40, 50)">
    <!-- Perfect Point-Symmetric Logo Geometry -->
    <path id="half-block" d="M 63.4,100 L 63.4,200 L 150,250 L 168,239.6 L 120.25,144 L 160.25,144 L 121.5,66.5 Z" />
    
    <use href="#half-block" fill="#1b3b5a" />
    <use href="#half-block" fill="#f05b22" transform="rotate(180, 150, 150)" />
  </g>
  
  <!-- Text Group -->
  <g transform="translate(320, 205)">
    <text x="0" y="0" class="bhm">BHM</text>
    <text x="5" y="65" class="energy">ENERGY</text>
  </g>
</svg>
